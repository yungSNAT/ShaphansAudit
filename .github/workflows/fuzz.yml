name: Fuzz

on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly and the pinned cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked --version 0.13.2
      # The synthetic test transcripts seed the corpus.
      - name: Fuzz for 5 minutes
        run: |
          mkdir -p fuzz/corpus/transcript fuzz/seeds
          find tests/fixtures -type f \( -name '*.jsonl' -o -name '*.jsonl.zst' \) -exec cp --backup=numbered {} fuzz/seeds/ \;
          cargo +nightly fuzz run transcript fuzz/corpus/transcript fuzz/seeds -- -max_total_time=300 -max_len=65536 -rss_limit_mb=4096
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-transcript
          path: fuzz/artifacts/transcript
